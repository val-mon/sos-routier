[project]
name = "sos-routier"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "audioop-lts>=0.2.2",
    "fastapi>=0.115.0",
    "librosa>=1.0.0",
    "pydub>=0.25.1",
    "dotenv>=0.9.9",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "transformers>=5.20.2",
    "typesafe-sdk>=0.7.5",
    "scikit-learn>=1.9.1",
    "geopandas>=1.2.0",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "transformers>=5.20.2",
    "typesafe-sdk>=0.7.5",
    "uvicorn>=0.34.0",
    "tabicl>=2.2.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["./modules"]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
